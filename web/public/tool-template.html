<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>웹 도구 시작 템플릿</title>
<!--
  기후시민플랫폼 웹 도구 시작 템플릿

  · 이 HTML은 플랫폼 화면 안의 iframe(sandbox="allow-scripts")에서 실행돼요.
    플랫폼과 다른 출처로 돌아가므로 플랫폼의 로그인 정보 · 저장소에 직접 닿지 않아요.
    localStorage, 쿠키, 외부 서버로 보내기 대신 아래 연결 기능(window.platform)만 쓰세요.
  · 연결 기능은 모두 Promise를 돌려줘요. 실패하면 err.code에 이유가 들어 있어요.
      platform.getUser()          → { nickname, region }        (권한: user — 비회원이면 null)
      platform.getCampaign()      → { id, title, status, today, dayIndex }  (권한 없이 — 캠페인 밖이면 null)
      platform.getParticipation() → { joined, startTotal }      (권한: participation)
      platform.saveRecord(values) → { id }                      (권한: record — 설명란의 저장 값 이름만)
      platform.listMyRecords()    → [{ id, values, createdAt, simDate, campaignId }]  (권한: record)
      platform.getAggregate(key)  → { key, op, value, count, participants, sum, avg }  (설명란의 집계 값만)
      platform.resize(height)     → 블록 높이(px, 0–3000). 내용이 바뀌면 자동으로 보내므로 보통 부를 일이 없어요.
      platform.toast(text)        → 화면 아래 짧은 알림(60자까지)
    설명란에 없는 권한을 쓰면 PERMISSION_DENIED, 없는 기능 이름이면 UNKNOWN_METHOD 오류가 나요.
  · 이 예제를 올릴 때 설명란(manifest) 예:
      { "permissions": ["user", "record"], "saveKeys": ["count"], "aggregateKeys": [{ "key": "count", "op": "sum" }] }
  · 관리자 미리보기에서 저장한 기록은 실제 기록과 섞이지 않아요(집계에도 들어가지 않아요).
-->
<!-- 연결 기능(브리지 클라이언트). 플랫폼이 같은 코드를 자동으로 넣어 주므로 지우거나 고치지 않아도 돼요. -->
<script>(function () {
  if (window.platform) return;
  var seq = 0, pending = {};
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (e.source !== window.parent || !d || d.__bridge !== 1 || !pending[d.id]) return;
    var p = pending[d.id]; delete pending[d.id];
    if (d.ok) p.resolve(d.result);
    else { var err = new Error((d.error && d.error.message) || 'bridge error'); err.code = d.error && d.error.code; p.reject(err); }
  });
  function call(method, args) {
    return new Promise(function (resolve, reject) {
      var id = 'b' + (++seq);
      pending[id] = { resolve: resolve, reject: reject };
      window.parent.postMessage({ __bridge: 1, id: id, method: method, args: args || [] }, '*');
    });
  }
  window.platform = {
    getUser: function () { return call('getUser'); },
    getCampaign: function () { return call('getCampaign'); },
    getParticipation: function () { return call('getParticipation'); },
    saveRecord: function (values) { return call('saveRecord', [values]); },
    listMyRecords: function () { return call('listMyRecords'); },
    getAggregate: function (key) { return call('getAggregate', [key]); },
    resize: function (height) { return call('resize', [height]); },
    toast: function (text) { return call('toast', [text]); }
  };
  var last = -1;
  function measure() {
    var b = document.body; if (!b) return;
    var cs = getComputedStyle(b);
    var h = Math.ceil(b.getBoundingClientRect().height + parseFloat(cs.marginTop || '0') + parseFloat(cs.marginBottom || '0'));
    if (h !== last) { last = h; call('resize', [h]).catch(function () {}); }
  }
  function watch() {
    measure();
    if (window.ResizeObserver) new ResizeObserver(measure).observe(document.body);
    window.addEventListener('load', measure);
  }
  if (document.body) watch(); else document.addEventListener('DOMContentLoaded', watch);
})();</script>
<style>
  /* 플랫폼 디자인 토큰 — 화면과 어울리게 이 값을 쓰세요 */
  :root {
    --c-text: #1A1F1C; --c-text-sub: #6B736E; --c-green: #1F854F; --c-green-dark: #186A3F; --c-green-tint: #E6F5EB;
    --c-surface: #FFFFFF; --c-line: #DEE3E0; --r-card: 16px; --r-btn: 10px;
  }
  /* 블록은 본문 폭에 맞춰 늘어나요. 바깥 여백은 0으로 두고 카드 안쪽 여백만 주세요. */
  html, body { margin: 0; background: transparent; }
  body { font-family: 'Asta Sans', system-ui, sans-serif; color: var(--c-text); }
  .card { background: var(--c-surface); border: 1px solid var(--c-line); border-radius: var(--r-card); padding: 24px; }
  h2 { margin: 0 0 8px; font-size: 20px; }
  p { margin: 0 0 16px; color: var(--c-text-sub); font-size: 15px; }
  button { background: var(--c-green); color: #fff; border: 0; border-radius: var(--r-btn); padding: 12px 20px; font: inherit; font-weight: 700; cursor: pointer; }
  button:hover { background: var(--c-green-dark); }
  .sum { margin-top: 16px; padding: 12px 16px; border-radius: var(--r-btn); background: var(--c-green-tint); font-size: 15px; }
</style>
</head>
<body>
<div class="card">
  <h2 id="hello">안녕하세요</h2>
  <p>버튼을 누를 때마다 실천 한 번을 기록해요.</p>
  <button id="save" type="button">실천 1회 기록하기</button>
  <div class="sum" id="sum">모두의 기록을 불러오는 중이에요</div>
</div>
<script>
  var count = 0;

  // 1) 사용자 정보: 권한 user가 있어야 해요. 비회원이면 null이 와요.
  platform.getUser().then(function (user) {
    document.getElementById('hello').textContent = user ? user.nickname + '님, 안녕하세요' : '안녕하세요';
  }).catch(function () { /* 권한이 없으면 기본 인사를 둬요 */ });

  // 2) 집계: 설명란 aggregateKeys에 적은 값만 볼 수 있어요. 캠페인 안에서는 그 캠페인 기록만 셉니다.
  function showSum() {
    platform.getAggregate('count').then(function (a) {
      document.getElementById('sum').textContent = '지금까지 모두 ' + (a.value || 0) + '회 실천했어요 (' + a.participants + '명)';
    }).catch(function () {
      document.getElementById('sum').textContent = '집계를 불러오지 못했어요';
    });
  }
  showSum();

  // 3) 기록 저장: 권한 record + 설명란 saveKeys에 적은 이름만 저장할 수 있어요. 값은 글자 · 숫자 · 참/거짓.
  document.getElementById('save').addEventListener('click', function () {
    count += 1;
    platform.saveRecord({ count: count }).then(function () {
      platform.toast('기록했어요');
      showSum();
    }).catch(function (err) {
      // 비회원(NO_USER) 등은 err.code로 나눠 안내해요.
      platform.toast(err.code === 'NO_USER' ? '로그인하면 기록할 수 있어요' : '기록하지 못했어요');
    });
  });
</script>
</body>
</html>
